<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nora Hotel</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:'Montserrat',sans-serif;
background:#0c0c0c;
color:#fff;
overflow-x:hidden;
}

/* LOADING */
#loader{
position:fixed;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
.loader-text{
font-family:'Playfair Display',serif;
font-size:30px;
color:#d4af37;
animation:blink 1.5s infinite;
}
@keyframes blink{
0%,100%{opacity:1;}
50%{opacity:0.3;}
}

/* NAVBAR */
nav{
position:fixed;
top:0;
width:100%;
background:rgba(0,0,0,.85);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
}

.logo{
color:#d4af37;
font-family:'Playfair Display',serif;
font-size:22px;
}

.menu-toggle{
font-size:26px;
cursor:pointer;
display:block;
}

.nav-links{
position:absolute;
top:60px;
left:0;
width:100%;
background:#111;
display:none;
flex-direction:column;
text-align:center;
padding:20px 0;
}

.nav-links a{
color:#fff;
text-decoration:none;
padding:12px;
display:block;
}

.nav-links a:hover{
color:#d4af37;
}

.show-menu{
display:flex;
}

/* HEADER */
header{
height:100vh;
background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url('hotel.jpg');
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
margin-top:60px;
}

h1{
font-family:'Playfair Display',serif;
font-size:34px;
color:#d4af37;
}

.subtitle{
margin-top:10px;
font-size:16px;
}

.btn{
margin-top:20px;
padding:12px 25px;
background:linear-gradient(45deg,#d4af37,#f5e6a7);
color:black;
text-decoration:none;
border-radius:25px;
font-weight:bold;
}

/* SECTION */
section{
padding:80px 20px;
text-align:center;
background:#111;
}

.section-title{
font-family:'Playfair Display',serif;
color:#d4af37;
font-size:26px;
margin-bottom:30px;
}

.rooms{
display:flex;
flex-direction:column;
gap:20px;
}

.card{
background:#1a1a1a;
border:1px solid #d4af37;
padding:20px;
border-radius:12px;
}

.price{
margin-top:8px;
color:#ccc;
}

iframe{
width:100%;
height:300px;
border:none;
border-radius:12px;
}

footer{
background:#000;
padding:20px;
text-align:center;
color:#aaa;
}

/* DESKTOP */
@media(min-width:768px){

.menu-toggle{
display:none;
}

.nav-links{
position:static;
display:flex !important;
flex-direction:row;
background:none;
width:auto;
padding:0;
}

.nav-links a{
padding:0 15px;
}

.rooms{
flex-direction:row;
justify-content:center;
}

.card{
width:280px;
}

h1{
font-size:60px;
}

}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
<div class="loader-text">NORA HOTEL</div>
</div>

<nav>
<div class="logo">NORA HOTEL</div>
<div class="menu-toggle" onclick="toggleMenu()">☰</div>
<div class="nav-links" id="navLinks">
<a href="#rooms">Xonalar</a>
<a href="#location">Manzil</a>
<a href="https://t.me/nora_hotel" target="_blank">Bron</a>
<a href="tel:+998770821717">Qo‘ng‘iroq</a>
</div>
</nav>

<header>
<h1>NORA HOTEL</h1>
<p class="subtitle">Luxury & Comfort</p>
<a href="https://t.me/nora_hotel" target="_blank" class="btn">Bron qilish</a>
</header>

<section id="rooms">
<h2 class="section-title">Xonalar</h2>
<div class="rooms">
<div class="card">
<h3>Standart</h3>
<p class="price">360 000 so'm</p>
</div>
<div class="card">
<h3>Deluxe</h3>
<p class="price">410 000 so'm</p>
</div>
<div class="card">
<h3>Lux</h3>
<p class="price">460 000 so'm</p>
</div>
</div>
</section>

<section id="location">
<h2 class="section-title">Manzil</h2>
<iframe src="https://yandex.com/map-widget/v1/?text=%D0%BA%D0%B8%D1%87%D0%B8%D0%BA%20%D0%B1%D0%B5%D1%88%D0%B0%D0%B3%D0%B0%D1%87%2057%20%D0%A2%D0%B0%D1%88%D0%BA%D0%B5%D0%BD%D1%82"></iframe>
