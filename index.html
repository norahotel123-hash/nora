<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nora Hotel | Luxury Stay</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#0c0c0c;
color:#fff;
font-family:'Montserrat',sans-serif;
scroll-behavior:smooth;
}

/* NAVBAR */
nav{
position:fixed;
width:100%;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
transition:.4s;
z-index:1000;
}

nav.scrolled{
background:#000;
box-shadow:0 5px 20px rgba(0,0,0,.7);
}

.logo{
font-family:'Playfair Display',serif;
font-size:28px;
background:linear-gradient(90deg,#d4af37,#fff,#d4af37);
background-size:200%;
-webkit-background-clip:text;
color:transparent;
animation:shine 4s linear infinite;
}

@keyframes shine{
0%{background-position:-200%;}
100%{background-position:200%;}
}

.nav-links a{
color:#fff;
text-decoration:none;
margin-left:25px;
font-size:15px;
transition:.3s;
}

.nav-links a:hover{
color:#d4af37;
}

.lang{
margin-left:20px;
cursor:pointer;
color:#d4af37;
}

/* HEADER */
header{
height:100vh;
background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),url('hotel.jpg');
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
animation:fadeIn 2s forwards;
}

@keyframes fadeIn{
to{opacity:1;}
}

h1{
font-family:'Playfair Display',serif;
font-size:60px;
letter-spacing:3px;
color:#d4af37;
}

.subtitle{
font-size:20px;
opacity:.8;
}

.btn{
margin-top:25px;
padding:12px 30px;
background:linear-gradient(45deg,#d4af37,#f5e6a7);
color:black;
text-decoration:none;
border-radius:30px;
font-weight:bold;
transition:.3s;
}
.btn:hover{
transform:scale(1.1);
}

/* SECTIONS */
section{
padding:100px 20px;
text-align:center;
opacity:0;
transform:translateY(40px);
transition:1s;
}

section.show{
opacity:1;
transform:translateY(0);
}

.section-title{
font-family:'Playfair Display',serif;
font-size:40px;
color:#d4af37;
margin-bottom:40px;
}

.rooms{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:30px;
}

.card{
background:#111;
border:1px solid #d4af37;
padding:30px;
width:280px;
border-radius:15px;
transition:.4s;
cursor:pointer;
}
.card:hover{
transform:translateY(-10px);
box-shadow:0 0 25px rgba(212,175,55,.5);
}

.price{
margin-top:10px;
opacity:.8;
}

iframe{
width:100%;
height:350px;
border:none;
border-radius:15px;
}

footer{
background:#000;
padding:30px;
text-align:center;
color:#aaa;
}
</style>
</head>

<body>

</nav>
