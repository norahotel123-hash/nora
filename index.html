<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nora Hotel</title>

<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
header{
position:relative;
height:100vh;
overflow:hidden;
color:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center}
.slider{
position:absolute;
width:100%;height:100%;
top:0;left:0;
z-index:-1}
.slide{
position:absolute;
width:100%;height:100%;
background-size:cover;
background-position:center;
opacity:0;
transition:opacity 1s}
.slide.active{opacity:1}

.overlay{
position:absolute;
width:100%;height:100%;
background:rgba(0,0,0,.5);
z-index:-1}

h1{font-size:50px}
.btn{
background:#d4af37;
padding:12px 25px;
color:black;
text-decoration:none;
border-radius:5px;
margin-top:15px;
display:inline-block}
section{padding:60px 20px;text-align:center}
.rooms{display:flex;flex-wrap:wrap;justify-content:center}
.card{
background:white;
margin:15px;
padding:20px;
width:280px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
cursor:pointer;
transition:.3s}
.card:hover{transform:scale(1.05)}

.modal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center}
.modal-content{
background:white;
padding:20px;
max-width:700px;
width:95%;
border-radius:10px}
.modal img{width:100%;margin:10px 0;border-radius:8px}
.close{color:red;cursor:pointer}

iframe{width:100%;height:350px;border:none;margin-top:20px}
footer{background:#111;color:white;padding:20px}
</style>
</head>

<body>

<header>
<div class="slider">
<div class="slide active" style="background-image:url('hotel.jpg')"></div>
<div class="slide" style="background-image:url('standard1.jpg')"></div>
<div class="slide" style="background-image:url('deluxe1.jpg')"></div>
</div>
<div class="overlay"></div>

<h1>NORA HOTEL</h1>
<p>Qulaylik va hashamat bir joyda</p>
<a href="https://t.me/nora_hotel" target="_blank" class="btn">Bron qilish</a>
<a href="https://instagram.com/nora_hotel" target="_blank" class="btn">Instagram</a>
</header>

<section>
<h2>Xonalar</h2>
<div class="rooms">

<div class="card" onclick="openRoom('standard')">
<h3>Standart Room</h3>
<p>360 000 so'm</p>
</div>

<div class="card" onclick="openRoom('deluxe')">
<h3>Deluxe Room</h3>
<p>410 000 so'm</p>
</div>

<div class="card" onclick="openRoom('lux')">
<h3>Lux Room</h3>
<p>460 000 so'm</p>
</div>

</div>
</section>

<!-- MODAL -->
<div class="modal" id="roomModal">
<div class="modal-content">
<span class="close" onclick="closeModal()">Yopish ✖</span>
<div id="roomImages"></div>
</div>
</div>

<section>
<h2>Manzil</h2>

<!-- YANDEX MAP -->
<iframe src="https://yandex.com/map-widget/v1/?text=Kichik%20Beshyog%27och%2057%20Tashkent"></iframe>

<p>📍 Kichik Beshyog‘och 57</p>
<p>📞 +998770821717</p>

</section>

<footer>
© 2026 Nora Hotel
</footer>

<script>
// SLIDER
let slides=document.querySelectorAll('.slide');
let index=0;
setInterval(()=>{
slides[index].classList.remove('active');
index=(index+1)%slides.length;
slides[index].classList.add('active');
},4000);

// ROOM MODAL
function openRoom(type){
let imagesDiv=document.getElementById("roomImages");
imagesDiv.innerHTML="";
let images={
standard:["standard1.jpg","standard2.jpg"],
deluxe:["deluxe1.jpg","deluxe2.jpg"],
lux:["lux1.jpg","lux2.jpg"]
};
images[type].forEach(img=>{
let image=document.createElement("img");
image.src=img;
imagesDiv.appendChild(image);
});
document.getElementById("roomModal").style.display="flex";
}
function closeModal(){
document.getElementById("roomModal").style.display="none";
}
</script>

</body>
</html>
